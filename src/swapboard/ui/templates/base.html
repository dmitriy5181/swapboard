<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}swapboard{% endblock %}</title>
    <script>
        (function () {
            try {
                var storedMode = localStorage.getItem("swapboard-theme");
                if (storedMode === "dark" || storedMode === "light") {
                    document.documentElement.setAttribute("data-bs-theme", storedMode);
                }
            } catch (e) {
                // Ignore browsers/environments where localStorage is unavailable.
            }
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('models_bp.index') }}">
                <i class="bi bi-hdd-network"></i>
                swapboard
            </a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item d-flex align-items-center">
                    <button type="button"
                            id="theme-toggle"
                            class="nav-link btn btn-link border-0 p-0 px-2"
                            aria-label="Toggle dark/light theme"
                            title="Toggle dark/light theme">
                        <i class="bi bi-moon-stars-fill" id="theme-toggle-icon"></i>
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <footer class="border-top mt-5 py-3 text-muted small">
        <div class="container text-center">
            <span>swapboard &middot; model management for llama-swap</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
