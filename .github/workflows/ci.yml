name: CI

on:
  # Pull requests are where changes are gated. The push trigger is scoped to
  # main so it only runs post-merge: merge commits can combine two individually
  # green branches into a broken tree, and nothing else would catch that.
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:

# A new push to a branch makes the previous run redundant. Runs on main and on
# releases are never cancelled, since those are the ones worth keeping.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras --group dev

      - name: Lint with ruff
        run: uv run ruff check src tests

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Type check with ty
        run: uv run ty check src tests

      - name: Run tests with coverage
        run: uv run pytest --cov

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'release'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # hatch-vcs derives the version from the release tag.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build wheel and sdist
        run: uv build

      - name: Check the release tag matches the built version
        run: |
          tag="${{ github.event.release.tag_name }}"
          set -- dist/swapboard-*.whl
          test "$#" -eq 1
          built="$(basename "$1" | cut -d- -f2)"
          test "${built}" = "${tag}" || {
            echo "Built version ${built} does not match tag ${tag}" >&2
            exit 1
          }

      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    environment: pypi
    permissions:
      # Required for Trusted Publishing; no API token is stored.
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  deploy-macos:
    name: Deploy to macOS
    runs-on: [self-hosted, macOS, ARM64]
    # Deploys what PyPI actually serves, so it cannot run before the publish
    # succeeded. This also scopes the job to releases without a second
    # condition that could drift away from the one on publish-pypi.
    needs: publish-pypi
    environment: macos
    timeout-minutes: 60
    # A deployment replaces running services. Letting a second one cancel it
    # half way through would leave the host without a working install.
    concurrency:
      group: swapboard-macos-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ github.event.release.tag_name }}
      SWAPBOARD_CONFIG_PATH: ${{ vars.SWAPBOARD_CONFIG_PATH }}

    steps:
      - name: Validate the deployment configuration
        run: |
          test -n "${SWAPBOARD_CONFIG_PATH}" || {
            echo "SWAPBOARD_CONFIG_PATH GitHub Actions variable is required" >&2
            exit 1
          }
          test -f "${SWAPBOARD_CONFIG_PATH}" || {
            echo "No llama-swap config on this host at ${SWAPBOARD_CONFIG_PATH}" >&2
            exit 1
          }
          # swapboard derives its prefix from the parent of its virtualenv, so
          # this is the only path the deployment needs to be told about.
          echo "APP_VENV=${HOME}/.swapboard/venv" >>"${GITHUB_ENV}"

      - name: Ensure uv is installed
        run: command -v uv >/dev/null || brew install uv

      - name: Install the published release
        run: |
          "${APP_VENV}/bin/python" -c \
            'import sys; assert sys.version_info[:2] == (3, 14)' 2>/dev/null \
            || uv venv --clear --python 3.14 "${APP_VENV}"
          # PyPI does not always serve a version the moment it is published.
          installed=""
          for _ in 1 2 3 4 5 6; do
            if uv pip install --python "${APP_VENV}/bin/python" \
                --reinstall-package swapboard \
                "swapboard[all]==${RELEASE_VERSION}"; then
              installed="yes"
              break
            fi
            sleep 10
          done
          test -n "${installed}" || {
            echo "swapboard ${RELEASE_VERSION} is not installable from PyPI" >&2
            exit 1
          }
          version="$("${APP_VENV}/bin/python" -c \
            'import importlib.metadata; print(importlib.metadata.version("swapboard"))')"
          test "${version}" = "${RELEASE_VERSION}" || {
            echo "Installed ${version}, expected ${RELEASE_VERSION}" >&2
            exit 1
          }

      - name: Deploy the launchd services
        env:
          SWAPBOARD_HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          "${APP_VENV}/bin/swapboard-deploy" deploy \
            --config "${SWAPBOARD_CONFIG_PATH}"
