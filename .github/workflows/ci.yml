name: CI

on:
  # Pull requests are where changes are gated. The push trigger is scoped to
  # main so it only runs post-merge: merge commits can combine two individually
  # green branches into a broken tree, and nothing else would catch that.
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:

# A new push to a branch makes the previous run redundant. Runs on main and on
# releases are never cancelled, since those are the ones worth keeping.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras --group dev

      - name: Lint with ruff
        run: uv run ruff check src tests

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Type check with ty
        run: uv run ty check src tests

      - name: Run tests with coverage
        run: uv run pytest --cov

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'release'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # hatch-vcs derives the version from the release tag.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build wheel and sdist
        run: uv build

      - name: Check the release tag matches the built version
        run: |
          tag="${{ github.event.release.tag_name }}"
          set -- dist/swapboard-*.whl
          test "$#" -eq 1
          built="$(basename "$1" | cut -d- -f2)"
          test "${built}" = "${tag}" || {
            echo "Built version ${built} does not match tag ${tag}" >&2
            exit 1
          }

      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    environment: pypi
    permissions:
      # Required for Trusted Publishing; no API token is stored.
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
